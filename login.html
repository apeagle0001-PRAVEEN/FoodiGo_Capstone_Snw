<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodigo - Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url("https://images.unsplash.com/photo-1504674900672-efe75612b6c4?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }

    .login-container {
      width: 350px;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #ef4f5f;
      text-shadow: 0 0 10px rgba(239, 79, 95, 0.4);
    }

    .input-field {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #ef4f5f;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }
    .login-btn:hover {
      background: #d93a4b;
    }

    .extra-links {
      margin-top: 15px;
      font-size: 14px;
    }

    .extra-links a {
      color: #ef4f5f;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h2>Login to Foodigo</h2>

    <input type="email" class="input-field" placeholder="Enter your email" required>
    <input type="password" class="input-field" placeholder="Enter password" required>

    <button class="login-btn">Login</button>

    <div class="extra-links">
      <p><a href="#">Forgot Password?</a></p>
      <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      <p><a href="index.html">← Back to Home</a></p>
    </div>
  </div>

</body>
</html>
